
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Войти ♡ — С любовью на тарелке</title>
  <style>
    :root {
      --ink: #765363;
      --pink: #efd5df;
      --line: #efd5df;
      --background: #fffafb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--ink);
      font-family: Georgia, serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 30px 20px;
      text-align: center;
      font-size: 23px;
    }

    header a {
      color: inherit;
      text-decoration: none;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px 70px;
    }

    .login-card {
      width: 100%;
      max-width: 470px;
      padding: 48px 36px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: #fff7f9;
      text-align: center;
    }

    h1 {
      font-size: clamp(34px, 6vw, 48px);
      line-height: 1.2;
      font-weight: normal;
      margin: 0 0 22px;
    }

    p {
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 16px;
      margin-bottom: 15px;
      border: 1px solid #e8c4d2;
      border-radius: 15px;
      background: white;
      font-size: 15px;
      outline-color: #c997ab;
    }

    button {
      margin-top: 12px;
      padding: 15px 35px;
      border: none;
      border-radius: 30px;
      background: var(--pink);
      color: var(--ink);
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #e6c1cf; }

    .back {
      display: block;
      margin-top: 28px;
      color: var(--ink);
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    #message {
      font-family: Arial, sans-serif;
      font-size: 14px;
      margin-top: 16px;
    }

    footer {
      text-align: center;
      padding: 24px;
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html">С любовью на тарелке ♡</a>
  </header>

  <main>
    <section class="login-card">
      <h1>Наша маленькая<br>кухня ♡</h1>

      <p>Войди, чтобы сохранить любимые блюда</p>

      <form id="login-form">
        <input
          type="email"
          id="email"
          placeholder="Электронная почта"
          autocomplete="email"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Пароль"
          autocomplete="current-password"
          required
        >

        <button type="submit">Войти ♡</button>
      </form>

      <div id="message" role="status" aria-live="polite"></div>

      <a href="index.html" class="back">
        ← Вернуться к рецептам
      </a>
    </section>
  </main>

  <footer>С любовью на тарелке ♡</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const supabaseClient = window.supabase.createClient(
      "https://mmzreariyjlexkymuqem.supabase.co",
      "sb_publishable_UMOLUGp5wv5IxaneM5ypzQ_yYAQKw9R"
    );

    document.getElementById("login-form")
      .addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");

        message.textContent = "Входим... ♡";

        const { error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          message.textContent = "Не удалось войти. Проверь почту и пароль.";
          return;
        }

        window.location.href = "index.html";
      });
  </script>

</body>
</html>

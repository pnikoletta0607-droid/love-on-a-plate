
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя кухня ♡ — С любовью на тарелке</title>

  <style>
    :root {
      --bg: #fffafb;
      --pink: #efd8e1;
      --ink: #765562;
      --line: #f0d4de;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 45px 20px 25px;
    }

    .logo {
      font: italic 38px Georgia, serif;
      color: var(--ink);
      text-decoration: none;
    }

    .subtitle {
      font: 17px Georgia, serif;
      margin-top: 12px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      padding: 20px;
      border-bottom: 1px solid var(--line);
    }

    nav a {
      color: var(--ink);
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 30px;
    }

    nav a.active {
      background: var(--pink);
    }

    main {
      max-width: 950px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .welcome {
      text-align: center;
      background: #fff1f5;
      border: 1px solid var(--line);
      border-radius: 30px;
      padding: 45px 25px;
    }

    h1 {
      font: 48px Georgia, serif;
      margin: 0 0 18px;
    }

    h2 {
      font: 30px Georgia, serif;
    }

    .email {
      overflow-wrap: anywhere;
    }

    .section {
      margin-top: 40px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 25px;
      padding: 30px;
    }

    button {
      background: var(--pink);
      color: var(--ink);
      border: 0;
      border-radius: 30px;
      padding: 14px 28px;
      font-size: 16px;
      cursor: pointer;
    }

    .logout {
      display: block;
      margin: 35px auto;
    }

    footer {
      text-align: center;
      padding: 35px;
      border-top: 1px solid var(--line);
      font-family: Georgia, serif;
    }

    @media (max-width: 600px) {
      h1 { font-size: 36px; }
      .logo { font-size: 29px; }
      main { margin-top: 25px; }
      .section { padding: 22px; }
    }
  </style>
</head>

<body>

  <header>
    <a class="logo" href="index.html">
      С любовью на тарелке ♡
    </a>
    <p class="subtitle">Наша маленькая кухня</p>
  </header>

  <nav>
    <a href="index.html">Главная</a>
    <a href="index.html#recipes">Рецепты</a>
    <a class="active" href="account.html">Моя кухня ♡</a>
  </nav>

  <main>
    <section class="welcome">
      <h1>Моя маленькая кухня ♡</h1>
      <p>Здесь живут твои любимые рецепты
        и маленькие кулинарные открытия.</p>
      <p class="email" id="user-email"></p>
    </section>

    <section class="section">
      <h2>Избранные рецепты ♡</h2>

<div id="favorites-list" class="favorites-grid"></div>

<p id="favorites-message">
  Здесь скоро появятся блюда,
  которые ты сохранишь с любовью.
</p>
    </section>

    <button class="logout" id="logout">
      Выйти из аккаунта ♡
    </button>
  </main>

  <footer>С любовью на тарелке ♡</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://mmzreariyjlexkymuqem.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_UMOLUGp5wv5IxaneM5ypzQ_yYAQKw9R";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function loadAccount() {
      const { data, error } =
        await supabaseClient.auth.getUser();

      if (error || !data.user) {
        window.location.replace("login.html");
        return;
      }

      document.getElementById("user-email").textContent =
        data.user.email || "";
      
const userId = data.user.id;

const { data: favorites, error: favoritesError } =
  await supabaseClient
    .from("favorites")
    .select("*")
    .eq("user_id", userId);

const favoritesList =
  document.getElementById("favorites-list");
const favoritesMessage =
  document.getElementById("favorites-message");

if (favoritesError) {
  favoritesMessage.textContent =
    "Ошибка: " + favoritesError.message;
  console.error("Ошибка избранного:", favoritesError);
} else if (!favorites || favorites.length === 0) {
  favoritesMessage.textContent =
    "Ты пока не добавил ни одного рецепта ♡";
} else {
  favoritesMessage.style.display = "none";

  const recipes = {
  "chicken-pasta": {
    name: "Паста с куриными тефтелями",
    image: "D7C69488-62CF-4375-A5D9-6E33A74342C8.png",
    link: "recipe.html"
  },
  "lasagna": {
  name: "Лазанья",
  image: "417DF3DA-F48A-4955-B603-1C677EF67519.png",
  link: "lasagna.html"
}
};

favoritesList.innerHTML = "";

favorites.forEach(item => {
  const recipe = recipes[item.recipe_id];
  if (!recipe) return;

  const card = document.createElement("div");
  card.style.cssText = `
    background: #fff;
    border: 1px solid #f0d6df;
    border-radius: 22px;
    padding: 18px;
    margin-top: 18px;
    max-width: 340px;
  `;

  card.innerHTML = `
    <img src="${recipe.image}"
      style="width:100%;height:200px;object-fit:cover;border-radius:16px;">
    <h3 style="margin:16px 0;color:#795968;">${recipe.name} ♡</h3>
    <a href="${recipe.link}"
      style="display:inline-block;background:#efd8e1;color:#795968;
      padding:12px 20px;border-radius:30px;text-decoration:none;">
      Открыть рецепт ♡
    </a>
  `;

  favoritesList.appendChild(card);
});
}

    }

    document.getElementById("logout")
      .addEventListener("click", async () => {
        const { error } =
          await supabaseClient.auth.signOut();

        if (error) {
          alert("Не удалось выйти. Попробуй ещё раз.");
          return;
        }

        window.location.replace("index.html");
      });

    loadAccount();
  </script>

</body>
</html>
